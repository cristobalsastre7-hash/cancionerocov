<title>Cancionero COV</title>
<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--ink:#1B1717;--mute:#6F6563;--acc:#D5202A;--accsoft:#FBE4E5;--line:#E6D3D3;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151111;--card:#1F1818;--ink:#F4EAE8;--mute:#B3A3A0;--acc:#F0636B;--accsoft:#3A2123;--line:#382A2B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151111;--card:#1F1818;--ink:#F4EAE8;--mute:#B3A3A0;--acc:#F0636B;--accsoft:#3A2123;--line:#382A2B;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 "Baskervville","Libre Baskerville",Baskerville,Georgia,serif;padding-bottom:76px}
h1,h2,.ttl{font-weight:400}
header{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--acc);color:#fff;font-size:16px;letter-spacing:.08em;box-shadow:0 3px 0 var(--bg),0 5px 0 var(--acc);margin-bottom:8px}
#th{margin-left:auto;background:none;border:1.5px solid #fff;color:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
header img{height:22px;width:auto}
main{max-width:640px;margin:0 auto;padding:14px 16px}
.hero{border:7px solid var(--acc);padding:18px 10px 16px;text-align:center;margin:4px 0 20px}
.hero h1{font-size:36px;line-height:1.05;margin:0 0 12px;letter-spacing:.02em}
.hero img{height:118px;width:auto}
input[type=search],input[type=text]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);font:inherit}
input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px}
.chip,.btn{border:1.5px solid var(--acc);background:transparent;color:var(--acc);border-radius:999px;padding:7px 14px;font:inherit;font-size:15px;white-space:nowrap;cursor:pointer}
.chip.on,.btn.fill{background:var(--acc);color:#fff}
.btn.sq{border-radius:4px;min-width:44px}
h2{font-size:24px;margin:22px 0 8px;color:var(--acc);text-transform:uppercase}
summary.cat{font-size:26px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);padding:12px 0 8px;border-bottom:3px solid var(--acc);cursor:pointer;margin-bottom:4px}
summary.cat .mute{font-size:15px;text-transform:none}
.row{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 4px;color:var(--ink);font:inherit;cursor:pointer}
.row .n{min-width:42px;font-weight:700;color:var(--acc)}
.row .k{margin-left:auto;color:var(--mute);font-size:14px}
.row .x{margin-left:8px;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer}
.mute{color:var(--mute);font-size:15px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.bar .grow{flex:1}
.scroll-tools{position:sticky;top:0;z-index:8;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:8px 0 12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.scroll-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.scroll-tools .btn{padding:5px 11px;font-size:14px}
.scroll-speed{display:flex;align-items:center;gap:9px;margin-top:8px;font:14px/1.3 system-ui,sans-serif;color:var(--mute)}
.scroll-speed input{flex:1;min-width:90px;accent-color:var(--acc)}
.scroll-status{font:12px/1.3 system-ui,sans-serif;color:var(--mute);margin-left:auto}
.tone{font-weight:700;min-width:64px;text-align:center}
.stt{font-size:26px;font-weight:700;margin:0 0 2px}
.song{padding:6px 2px;overflow-x:auto}
.ln{white-space:pre-wrap;line-height:1.4;margin:0}
.ln.it{font-style:italic}
.sp{height:16px}
.w{display:inline-block;white-space:nowrap;vertical-align:bottom}
.sg{display:inline-flex;flex-direction:column;vertical-align:bottom;position:relative;overflow:visible}
.sg b,.chord{color:var(--acc);font-weight:700;font-style:normal}
.sg b{margin-right:.45em;min-height:1.4em;line-height:1.4}
.sg i{font-style:inherit;white-space:pre;min-height:1.4em;min-width:.1em}
.chord-line-only{display:flex;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:2px 0}
.chord-line-only .chord{margin:0}
.chord-line-only .t{color:var(--mute);font-weight:400;white-space:pre-wrap}
.ln.it .t{font-style:italic}
.note{margin-top:14px;font-size:.85em;color:var(--mute);white-space:pre-wrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:3px solid var(--acc);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--mute);font:inherit;font-size:16px;letter-spacing:.04em;cursor:pointer}
nav button.on{color:var(--acc);font-weight:700}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>

as manos manchadas,\nhueso[F]s frágiles;\npara conversar [C]de mis errores,\nqu[G]e te he perdido.\n[C]Aquí estoy.\nlleno de victorias\nque [F]no dejan paz\natado a nuevos éx[Am]itos que atrapan.\nPe[G]rdóname.\n\n[F] Sin más ar[Am]maduras\nin[G]útiles\n[F]traigo aquí [C]mi vida entera.\nA[G]yúdame.\n\n[F]Y no busco s[C]oluciones,\nsolo pasos [G]más humanos\nque camine[C]n a m[G]i lado[F] otra vez.\nEs tu amor q[C]ue n[G]ecesito.\n\nTe miro y d[G]igo \"G[C]racias\".\n\"G[G]racias, porque me h[C]aces vivir\".\n\"[G]Gra[C]cias\".\n\"G[G]racias, porque Tu [C]Eres Amor\".\n\"[G]Veo con mayor c[C]laridad\n[F]Lo que puedo lle[G]gar a ser\nSi, [F]de la man[Fm]o, contigo[C] voy\".\n\n[C] [F] [C]"},{"n":120,"num":120,"t":"Dios te salve María","c":"Salida y Cantos a María","b":"[G]Dios te salve María Sagrada,\nMaría S[C]eñora de nuestro cami[G]no.\n[Em]Llena eres de gracia, amada[Bm] entre todos\nPara[C] ser la Madre de Di[G]os.\n\nEl Señor es contigo y tú eres\nLa sierva dispuesta a cumplir su Misión\nY bendita tú eres, dichosa te llaman a ti\nLa escogida de Dios.\n\n[C]Y bendito es el fruto\nQue tiene tu vientre,\n[G]El Mesías del pueblo d[D]e Dios.\n[G]Al que tanto esperamos q[C]ue nazca\n[D]Y que sea nuestro[G] Rey.\n\n[G]María he mirado hacia el cielo\nPensando entre n[C]ubes\n[G]Tu rostro encontrar.\n[Em]Y al fin te e[C]ncontré en un establo\n[G]Entregando l[D]a vida a Jesús Salvador\n\nMaría he querido sentirte entre tantos\nMilagros que cuentan de ti.\nY a[Em]l fin te encontré en mi cam[Bm]ino\n[C]En la misma vereda que y[G]o.\n[C]Tenías tu cuerpo cansado,\n[D]Un niño en los brazos\n[D7]Durmiendo en tu paz.\n[G]María mujer, que reg[C]alas la vid[D]a sin [G]fin.\n\nTú eres santa María,\nEres nuestra Señora,\nPorque haces tan nuestro al Señor.\nEres Madre de Dios,\nEres mi tierna Madre\nY Madre de la humanidad.\n\nTe pedimos que ruegues\nPor todos nosotros\nHeridos de tanto pecar,\nDesde hoy y hasta el día final\nDe este peregrinar.\n\nMaría, he buscado tu imagen serena\nVestida entre mantos de luz.\nY al fin te encontré dolorosa\nLlorando de pena\nA los pies de una cruz.\n\nMaría he querido sentirte entre tantos\nMilagros que cuentan de ti.\nY al fin te encontré en mi camino\nEn la misma vereda que yo."},{"n":121,"num":121,"t":"Dónde dos o tres","c":"Salida y Cantos a María","b":"DONDE DOS O TRES\nIntro / Estribillo\n[Em]Donde dos[C] o tres,[G] o más,\nestuviera[D]n reunidos\nen mi n[Em]ombre… (bis)\n[C]Yo estaré c[G]on ello[D]s en medio,\n[Am]construyendo al hombre nuevo. (bis)\nEstrofa 1\n[Em]Puede ser por causa [C]del a[Em]mor,\npuede ser por causa de la fe.\n[C]Puede ser padre o pas[G]tor,\npuede ser hombre o mujer.\n[D]Puede ser de lenguas [Em]diferentes,\npuede ser de otra religión.\n[D]Puede ser manso o va[Em]liente,\nestaré en su corazón.\nEstribillo\n[Em]Donde dos[C] o tres,[G] o más,\nestuviera[D]n reunidos\nen mi n[Em]ombre… (bis)\n[C]Yo estaré c[G]on ello[D]s en medio,\n[Am]construyendo al hombre nuevo. (bis)\nEstrofa 2\n[Em]Puede ser morador de[C] la ru[Em]ta,\npuede ser bandido o marginal.\n[C]Puede ser de la prostit[G]ución,\npuede ser de cuerpo desigual.\n[D]Puede ser quien nunc[Em]a me oyó,\npuede ser quien no sabe quién soy.\n[D]Puede ser quien en la [Em]droga cayó,\nquiere vida nueva: ¡aquí estoy!\n\n[Em]Donde dos[C] o tres,[G] o más,\nestuviera[D]n reunidos\nen mi n[Em]ombre… (bis)\n[C]Yo estaré c[G]on ello[D]s en medio,\n[Am]construyendo al hombre nuevo. (bis)"},{"n":122,"num":122,"t":"Dulce doncella","c":"Salida y Cantos a María","b":"[D]Estamo[A]s vivos[Bm] y vivimos\n[G]amar es nuestr[A]o destino\n[D]pero es[A]te viaje[Bm] es distinto,\n[G]sólo hay un sol[A]o camino\n[D]Llegar a[A] vos. L[Bm]ara lara la\n[G]Lara lara laaa l[A]a laaa\n\n[D]Sólo qu[A]edó hie[Bm]rba seca,\n[G]por donde ante[A]s pisamos,\n[D]hoy hay[A] flores [Bm]de pureza,\n[G]pues hacia ti ca[A]minamos,\n[D]Espéran[A]os lara[Bm], lara la\n[G]Lara lara laaa l[A]a laaa\n\n[D]Dulce d[A]once[Bm]lla,\n[G]te segui[A]ré, te seguiré\n[D]tú eres [A]mi estr[Bm]ella,\n[G]te alcan[A]zaré, te alcanzaré\n[D]Yo se q[A]ue sí lar[Bm]a lara la\n[G]Lara lar[A]a laaa la laaa\n\n[D]En la ru[A]ta de m[Bm]is días,\n[G]el viaje fue muy[A] pesado\n[D]hasta q[A]ue vi un[Bm]a doncella\n[G]y así juntos cam[A]inamos\n[D]Para lle[A]gar Lar[Bm]a lara la\n[G]Lara lar[A]a laaa la laaa\n\n[D]Me dem[A]ostró q[Bm]ue en la vida,\n[G]el amor es nec[A]esario,\n[D]el que [A]hasta ay[Bm]er se evadía\n[G]Por fin a[A]l puente ha llegado,\n[D]Lo cruz[A]ará lara [Bm]lara la.\n[G]Lara lar[A]a laaa la laaa\n\nESTRIBILLO\n\nA veces se siente sola,\npor los que aún no han llegado,\npero no los abandona\nsus huellas le va dejando,\nLa seguirán. Lara Lara la\nLara lara laaa la laaa\n\nEl amor que nos ha dado\nes la mejor comprensión\nla irrealidad fue el pasado\nel presente es nuestro Dios\nHasta el final Lara lara la\nLara lara laaa la laaa"},{"n":123,"num":123,"t":"El diario de María","c":"Salida y Cantos a María","b":"[C]Te miro a los ojo[A7]s y entre tanto [Dm]llanto\nParece men[G]tira que te hal[G7]lan cla[C]vado[C7]\nQue seas el peq[F]ueño[G] al que he acu[Em]nado\n[Am]Y que se dor[Dm]mía [G7]tan pronto en mis b[C]ra[C7]zos\nEl que se re[F]ía[G] al mirar el c[Em]ielo[Am]\nY cuando re[Dm]zaba [G]se ponía s[C]erio\n\n[E]Sobre ese ma[Am]dero,[A7] veo al peq[Dm]ueño\nQue entre los do[G]ctores habla[G7]ba en el t[C]emplo\nQue cuando pregun[F]té, respond[G]ió con [Em]calma[Am]\nQue de los as[Dm]untos[G7] de Dios se encarg[C]aba[C7]\nEse mismo n[F]iño,[G] el que está en la c[Em]ruz[Am]\nEl Dios de los h[Dm]ombres[G7] se llama Jes[C]ús\n\n[E]Ese mismo [Am]hombre[A7], ya no era un [Dm]niño\nCuando en esa b[G]oda le pe[G7]dí más v[C]ino[C7]\nQue dio de com[F]er[G] a un millar de [Em]gen[Am]tes\nY a pobres y en[Dm]fermos[G7] los miró de f[C]rente[C7]\nRió con aqu[F]ellos[G] a quienes más [Em]quiso[Am]\nY lloro en si[Dm]lencio al mor[G]ir su am[C]igo\n\n[E]Ya cae la [Am/C]tarde, se nublan los c[Dm7]ielos\nPronto vol[G]verás a tu p[G7]adre et[C]erno[C7]\nDuérmete [F]pequeño,[G] duérmete mi [Em]niño[Am7]\nQue yo te he entr[Dm7]egado[G] todo mi car[C]iño[Em7(5-)]\nComo en Nazar[F]et[G] aquella ma[E2]ñana[Eº]\nHe aquí tu si[Dm7]erva,[G7/B] he aquí tu esc[C]lava"},{"n":124,"num":124,"t":"Se llama María","c":"Salida y Cantos a María","b":"[G]Cómo se llama [D]esa persona\n[Em]que acompañó siempre tu historia, [C]que se graduó con vos\n[G]en la academia de la vida, [D]que fue curando las [Em]heridas que la guerra [C]dejó\nen tu corazón.\n\n[G]Cómo se llama [D]esa persona\n[Em]que fue bordándose en su manto [C]tu sueño de volar,\n[G]que se metiera en tus zapatos, [D]para seguir tu [Em]débil paso\n[C]y hacer todo esto sólo por amor…\n\n[G]Se llama Ma[D]ría, se llama Ma[Em]ría, la estrella que [C]guía al día,\nla madre del [G]sol. Se llama Ma[D]ría,\nla eterna compa[Em]ñía de mi cora[C]zón. De mi cora[G]zón, [D]Ma[Em]dre… [C](×4)\n\n[G]Cómo se llama [D]esa persona que en las [Em]arrugas de su mano [C]dibuja una ilusión,\n[G]de que tú y yo seamos [D]hermanos y que su [Em]voz sea nuestro [C]canto\ny nos convoque siempre para llegar a Dios."},{"n":125,"num":125,"t":"Sobre el mar","c":"Salida y Cantos a María","b":"[C]En tu [F]mirada me [Am]quiero per[G]der[C],\nPara encont[F]rarme [Am]y así ren[G]acer\n[C]Míra[F]me se[Am]ñor, [G]aumenta mi [C]fee[F]ee[Am]eeee[G]eee.\n[C]Saca las [F]dudas que m[Am]e hacen hun[G]dir.\n[C]Hasta tus [F]brazos yo [Am]voy a se[G]guir, [C]lláma[F]me [Am]Seño[G]r, voy haci[C]a ti[F]iii[Am]iiiiii[G]iii.\n\n[C]SI ES [F]QUE SIR[Am]VIEN[G]DO, [C]ME HA[F]GO PRI[Am]ME[G]RO,\n[C]HAZME TU [F]ESCLAVO Y MIS [Am]MANOS[G]\nSE LIBERAR[C]Á[F]AA[Am]AAA[G]AN\n\n[C]Vas cami[F]nando s[Am]obre la ma[G]rea.\n[C]Entre las [F]olas me [Am]dices no [G]temas,\n[C]Tú tie[F]nes mi a[Am]mor,[G]\nPuedes seg[C]uii[F]iiii[Am]iiiiiiii[G]iiir.\n\nESTRIBILLO\n\n[C]Tus huellas van mar[F]cando mi camino\nY no hay te[Am]mores por que estoy con[G]tigo.\n\nESTRIBILLO"},{"n":126,"num":126,"t":"Junto a tí María","c":"Salida y Cantos a María","b":" const CHORDISH=/^[A-G][#b]?[A-Za-z0-9#b+\-º°\/()]*$/;
const IND_RE=/^\s*\(?\s*(intro|interludio|intermedio|tono|capo|corte|outro|bajada|puente|final|solo|se repite)/i;
/* Devuelve [{c:acorde}|{t:texto}] con corchetes limpios y balanceados */
function parseLine(l){
 l=l.replace(/\[([^\[\]]*)$/,(m,c)=>CHORDISH.test(c.trim())?"["+c.trim()+"]":c); /* "[Am" sin cerrar al final */
 const out=[];
 l.split(/(\[[^\[\]]*\])/).forEach(x=>{
  if(x[0]==="["&&x.slice(-1)==="]"){const c=x.slice(1,-1).replace(/\s+/g,"");if(c)out.push({c})}
  else{const t=x.replace(/[\[\]]/g,"");if(t)out.push({t})}});
 /* acorde pegado a la última palabra al final de la línea: forzar separación */
 const n=out.length;if(n>1&&out[n-1].c&&out[n-2].t&&/\S$/.test(out[n-2].t))out[n-2].t+=" ";
 return out}
function chordOnly(parts,plain){
 if(!parts.some(p=>p.c))return false;

 if(IND_RE.test(plain))return true;                    /* INTRO: [A] … */

function body(s,sh){const fl=isFlat(s,sh);return s.b.split("\n").map(l=>{const it=l[0]==="_";if(it)l=l.slice(1);const o=(()=>{
 if(!l.trim())return '<div class="sp"></div>';
 if(!l.includes("["))return '<p class="ln">'+esc(l)+'</p>';
 const parts=parseLine(l),plain=parts.map(p=>p.t||"").join("");
 if(chordOnly(parts,plain)){
  return '<p class="ln chord-line-only">'+parts.map(p=>p.c?'<b class="chord">'+esc(tr(p.c,sh,fl))+'</b>':(p.t.trim()?'<span class="t">'+esc(p.t.trim())+'</span>':"")).join("")+'</p>'}
 /* línea de letra: segmentos acorde+texto; las sílabas de una palabra van juntas (sin cortes) */
 const segs=[];let cur=null;
 parts.forEach(p=>{if(p.c){cur={c:tr(p.c,sh,fl),t:""};segs.push(cur)}else if(cur)cur.t+=p.t;else{cur={c:"",t:p.t};segs.push(cur)}});
 /* el texto de cada acorde se parte en palabras: la 1ª queda bajo el acorde, el resto en columnas sin acorde */
 const sg2=[];segs.forEach(g=>{const tk=g.t.match(/\S+\s*|\s+/g)||[""];sg2.push({c:g.c,t:tk[0]});tk.slice(1).forEach(x=>sg2.push({c:"",t:x}))});
 segs.length=0;sg2.forEach(x=>segs.push(x));
 let h='<p class="ln">',open=false;
 segs.forEach((g,i)=>{if(!open){h+='<span class="w">';open=true}
  h+='<span class="sg"><b class="chord">'+(g.c?esc(g.c):"&nbsp;")+'</b><i>'+esc(g.t)+'</i></span>';
  if(/\s$/.test(g.t)||i===segs.length-1){h+='</span>';open=false}});
 return h+'</p>'})();return it?o.replace(/class="ln( chord-line-only)?"/,(m,x)=>'class="ln'+(x||"")+' it"'):o}).join("")}

function stopAutoScroll(status){if(scrollTimer!==null){clearInterval(scrollTimer);scrollTimer=null}scrollRunning=false;setScrollStatus(status||"Pausado")}
function startAutoScroll(){if(scrollTimer!==null)return;scrollRunning=true;setScrollStatus("En curso");scrollTimer=setInterval(()=>{const max=document.documentElement.scrollHeight-window.innerHeight;if(window.scrollY>=max-2){stopAutoScroll("Final de canción");return}window.scrollBy(0,scrollSpeed*0.5)},50)}
function open(n){stopAutoScroll("Listo para leer");S.song=n;const it=item(n);S.shift=it?it.s:0;S.view="song";draw();scrollTo(0,0)}
function songRow(s,showKey,sh,extra){return '<button class="row" data-open="'+s.n+'">'+'<span class="n">'+s.num+'-</span>'+'<span>'+esc(s.t)+'</span><span class="k">'+(showKey&&hasCh(s)?keyOf(s,sh||0):"")+'</span>'+(extra||"")+'</button>'}
function home(){
 const q=norm(S.q);
 let list=SONGS.filter(s=>(!S.cat||s.c===S.cat)&&(!q||norm(s.t+" "+s.b.replace(/\[[^\]]*\]/g,"")).includes(q))).sort((a,b)=>a.num-b.num);
 let h=(S.q||S.cat?"":'<div class="hero"><h1>CANCIONERO COV</h1><img src="'+(document.documentElement.dataset.theme==="dark"?LOGOW:LOGO)+'" alt="COV Córdoba"></div>')+'<input type="search" id="q" placeholder="Buscar canción o letra" value="'+esc(S.q)+'" aria-label="Buscar">';
 h+='<div class="chips"><button class="chip'+(S.cat?"":" on")+'" data-cat="">Todas</button>'+CATS.map(c=>'<button class="chip'+(S.cat===c?" on":"")+'" data-cat="'+c+'">'+c+'</button>').join("")+'</div>';
 if(!list.length)return h+'<p class="mute">No hay canciones para mostrar.</p>';
 (S.cat||q?[null]:CATS).forEach(c=>{const g=c?list.filter(s=>s.c===c):list;if(!g.length)return;if(c)h+='<details data-c="'+c+'"'+(S.open[c]?" open":"")+'><summary class="cat">'+c+' <span class="mute">('+g.length+')</span></summary>'+g.map(s=>songRow(s,true)).join("")+'</details>';else h+=g.map(s=>songRow(s,true)).join("")});
 return h}
function songView(){
 const s=byN(S.song),it=item(s.n),l=curList();
 let h='<div class="bar"><button class="btn" data-go="back">‹ Volver</button><span class="grow"></span><button class="btn'+(it?" fill":"")+'" data-add="1">'+(it?"En la lista ✓":"+ A la lista")+'</button></div>';
 h+='<h2 class="stt">'+s.num+'-<u>'+esc(s.t)+'</u></h2><div class="mute">'+s.c+(l?" · lista: "+esc(l.name):"")+'</div>';
 h+='<div class="bar">'+(hasCh(s)?'<button class="btn sq" data-sh="-1" aria-label="Bajar medio tono">−</button><span class="tone">Tono '+keyOf(s,S.shift)+'</span><button class="btn sq" data-sh="1" aria-label="Subir medio tono">+</button>'+(S.shift?'<button class="btn sq" data-sh="0">Original</button>':""):"")+'<span class="grow"></span><button class="btn sq" data-fs="-1" aria-label="Letra más chica">A−</button><button class="btn sq" data-fs="1" aria-label="Letra más grande">A+</button></div>';
 h+='<div class="scroll-tools" aria-label="Desplazamiento automático"><div class="scroll-actions"><button class="btn fill" type="button" data-scroll="start">▶ Iniciar</button><button class="btn" type="button" data-scroll="pause">Ⅱ Pausar</button><button class="btn" type="button" data-scroll="stop">■ Detener</button><span class="scroll-status" id="scrollStatus">'+(scrollRunning?'En curso':'Listo para leer')+'</span></div><label class="scroll-speed" for="scrollSpeed"><span>Velocidad</span><input id="scrollSpeed" type="range" min="1" max="10" step="1" value="'+scrollSpeed+'"><strong id="scrollSpeedValue">'+scrollSpeed+'</strong></label></div>';
 h+='<div class="song" style="font-size:'+S.fs+'px">'+body(s,S.shift)+(s.note?'<div class="note">'+esc(s.note)+'</div>':"")+'</div>';
 return h}
function listsView(){
 let h='<div class="chips">'+S.lists.map(l=>'<button class="chip'+(l.id===S.act?" on":"")+'" data-act="'+l.id+'">'+esc(l.name)+'</button>').join("")+'<button class="chip" data-new="1">+ Nueva lista</button></div>';
 if(S.newList)h+='<div class="bar"><input type="text" id="nl" placeholder="Nombre (ej: Misa domingo 19/10)" aria-label="Nombre de la lista"><button class="btn fill" data-create="1">Crear</button></div>';
 const l=curList();
 if(!l)return h+'<p class="mute">Todavía no hay listas. Creá una y sumá canciones desde cada canción con “+ A la lista”.</p>';
 h+='<div class="bar"><button class="btn" data-copy="1">Copiar texto</button><button class="btn" data-del="1">Borrar lista</button></div>';
 CATS.forEach(c=>{const g=l.items.filter(i=>byN(i.n)&&byN(i.n).c===c);if(!g.length)return;h+='<h2>'+c+'</h2>'+g.map(i=>{const s=byN(i.n);return songRow(s,true,i.s,'<span class="x" data-rm="'+s.n+'" role="button" aria-label="Quitar">×</span>')}).join("")});
 if(!l.items.length)h+='<p class="mute">La lista está vacía. Abrí una canción y tocá “+ A la lista”.</p>';
 return h}
function draw(){
 $("#t1").className=S.view==="lists"?"":"on";$("#t2").className=S.view==="lists"?"on":"";
 $("#app").innerHTML=S.view==="song"?songView():S.view==="lists"?listsView():home();
 const q=$("#q");if(q&&S.view==="home"&&S.focusQ){q.focus();q.setSelectionRange(q.value.length,q.value.length)}
 const nl=$("#nl");if(nl)nl.focus()}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-rm],[data-open],[data-cat],[data-go],[data-add],[data-sh],[data-fs],[data-act],[data-new],[data-create],[data-copy],[data-del],[data-scroll]");if(!t)return;
 const d=t.dataset;S.focusQ=false;
 if(d.scroll){if(d.scroll==="start")startAutoScroll();else if(d.scroll==="pause")stopAutoScroll("Pausado");else stopAutoScroll("Detenido");return}
 if(d.rm){const l=curList();l.items=l.items.filter(i=>i.n!==+d.rm);save();return draw()}
 if(d.open)return open(+d.open);
 if(d.cat!==undefined){S.cat=d.cat;return draw()}
 if(d.go){stopAutoScroll("Listo para leer");S.view=S.back||"home";return draw()}
 if(d.sh!==undefined){S.shift=d.sh==="0"?0:(S.shift+ +d.sh+12)%12;const it=item(S.song);if(it){it.s=S.shift;save()}return draw()}
 if(d.fs){S.fs=Math.max(14,Math.min(34,S.fs+ +d.fs*2));save();return draw()}
 if(d.add){let l=curList();if(!l){l={id:"l"+Date.now(),name:"Lista 1",items:[]};S.lists.push(l);S.act=l.id}
  const it=item(S.song);if(it){l.items=l.items.filter(i=>i.n!==S.song);toast("Quitada de la lista")}else{l.items.push({n:S.song,s:S.shift});toast("Agregada a "+l.name)}save();return draw()}
 if(d.act){S.act=d.act;save();return draw()}
 if(d.new){S.newList=true;return draw()}
 if(d.create){const v=$("#nl").value.trim();if(!v)return;const l={id:"l"+Date.now(),name:v,items:[]};S.lists.push(l);S.act=l.id;S.newList=false;save();return draw()}
 if(d.del){const l=curList();if(l&&confirm("¿Borrar la lista “"+l.name+"”?")){S.lists=S.lists.filter(x=>x!==l);S.act=S.lists.length?S.lists[0].id:null;save();draw()}return}
 if(d.copy){const l=curList();const txt=l.name+"\n"+CATS.map(c=>{const g=l.items.filter(i=>byN(i.n)&&byN(i.n).c===c).map(i=>byN(i.n).t+" ("+keyOf(byN(i.n),i.s)+")");return g.length?c+": "+g.join(", "):null}).filter(Boolean).join("\n");
  try{navigator.clipboard.writeText(txt).then(()=>toast("Lista copiada"),()=>toast("No se pudo copiar"))}catch(er){toast("No se pudo copiar")}}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;S.focusQ=true;draw()}else if(e.target.id==="scrollSpeed"){scrollSpeed=Number(e.target.value)||1;const v=$("#scrollSpeedValue");if(v)v.textContent=String(scrollSpeed)}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.c)S.open[d.dataset.c]=d.open},true);
$("#t1").onclick=()=>{S.view="home";draw()};
$("#t2").onclick=()=>{S.view="lists";S.back="lists";if(!S.act&&S.lists.length)S.act=S.lists[0].id;draw()};
const _o=open;open=function(n){S.back=S.view==="lists"?"lists":"home";_o(n)};
function setTheme(t,sv){document.documentElement.dataset.theme=t;$("#th").textContent=t==="dark"?"☀ Modo claro":"☾ Modo oscuro";if(sv)try{localStorage.setItem("cov_theme",t)}catch(e){}}
let T=null;try{T=localStorage.getItem("cov_theme")}catch(e){}
if(T!=="dark"&&T!=="light")T=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
setTheme(T,false);$("#th").onclick=()=>{setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark",true);draw()};
if(!S.act&&S.lists.length)S.act=S.lists[0].id;
draw();
</script>
</body>
</html>
